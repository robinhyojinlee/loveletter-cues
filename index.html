<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>러브레터 큐 플레이어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&family=Nanum+Myeongjo:wght@700;800&display=swap">
<style>
/* Layout: sound booth console. Sticky GO panel on top, cue sheet below grouped by scene, file bank at the end. Single dark look on purpose (rehearsal room, dim light). */
:root{
  color-scheme: dark;
  --ink:#0b1224;
  --panel:#121c36;
  --line:#24345e;
  --text:#e6ebf7;
  --muted:#8d9bc0;
  --cobalt:#3d6bff;
  --cobalt-soft:#1b2c66;
  --burgundy:#b0344d;
  --burgundy-soft:#3a1824;
  --paper:#efe4cf;
  --warn:#e0a84a;
  --f-display:"Nanum Myeongjo", "AppleMyungjo", serif;
  --f-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box}
html,body{background:var(--ink)}
body{color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
.wrap{max-width:920px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--cobalt);outline-offset:2px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:20px 12px}
.title{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,4.5vw,30px);color:var(--paper);margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.console{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);padding-block:8px 12px;border-bottom:1px solid var(--line)}
.deck{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:stretch}
.standby{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.standby .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--cobalt);text-transform:uppercase}
.standby .q{font-family:var(--f-mono);font-weight:600;font-size:22px}
.standby .when{font-size:15px;margin-top:2px}
.standby .what{color:var(--muted);font-size:13px}
.standby .row1{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.btns{display:flex;flex-direction:column;gap:8px}
.go{background:var(--cobalt);border:0;border-radius:12px;font-family:var(--f-mono);font-weight:600;font-size:26px;letter-spacing:.06em;padding:0 30px;flex:1;min-height:72px;color:#fff}
.go:active{transform:translateY(1px)}
.stopall{background:var(--burgundy-soft);border:1px solid var(--burgundy);border-radius:10px;font-weight:700;padding:8px 14px;color:#ffd9e0}
.live{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;min-height:30px;align-items:center}
.live .none{color:var(--muted);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--burgundy-soft);border:1px solid var(--burgundy);border-radius:999px;padding:3px 4px 3px 10px;font-size:13px}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--burgundy);animation:pulse 1.2s infinite}
.chip button{background:transparent;border:0;border-radius:999px;padding:2px 8px;color:#ffd9e0}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.chip .dot{animation:none}}
.tools{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:13px}
.tools input[type=range]{accent-color:var(--cobalt);width:140px}
.keys kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--text)}
.load{font-family:var(--f-mono);font-size:12px}
nav.scenes{display:flex;gap:6px;overflow-x:auto;padding-block:12px 4px;scrollbar-width:none}
nav.scenes button{flex:none;background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted)}
nav.scenes button:hover{color:var(--text);border-color:var(--muted)}
section.scene{margin-top:22px}
section.scene h2{font-family:var(--f-display);font-weight:700;font-size:19px;margin:0 0 2px;color:var(--paper)}
section.scene .place{color:var(--muted);font-size:13px;margin-bottom:8px}
.cue{display:grid;grid-template-columns:64px 52px 1fr auto;gap:10px;align-items:center;padding:9px 10px;border-bottom:1px solid var(--line);border-left:3px solid transparent;cursor:pointer}
.cue:hover{background:#101a33}
.cue .qn{font-family:var(--f-mono);font-weight:600}
.cue .ln{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cue .body{min-width:0}
.cue .when{font-size:14px}
.cue .what{font-size:13px;color:var(--muted)}
.cue .what b{color:var(--text);font-weight:500}
.cue.next{border-left-color:var(--cobalt);background:var(--cobalt-soft)}
.cue.playing{border-left-color:var(--burgundy);background:var(--burgundy-soft)}
.cue.kind-stop .qn,.cue.kind-level .qn{font-size:12px;color:var(--muted)}
.cue.kind-note{cursor:default}
.cue.kind-note:hover{background:transparent}
.cue.kind-note .qn{font-size:12px;color:var(--warn)}
.cue.kind-note .what{color:var(--warn)}
.tag{display:inline-block;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;color:var(--muted);vertical-align:1px}
.tag.mine{border-color:var(--cobalt);color:#b9c9ff}
.play{background:transparent;border:1px solid var(--line);border-radius:8px;width:40px;height:34px;font-size:13px}
.cue.playing .play{border-color:var(--burgundy);color:#ffd9e0}
.bank{margin-top:40px}
.bank h2{font-family:var(--f-display);font-size:19px;color:var(--paper);margin:0 0 4px}
.bank p{color:var(--muted);font-size:13px;margin:0 0 12px;max-width:65ch}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.file{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.file .nm{font-weight:500;min-width:0}
.file .src{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .src.mine{color:#b9c9ff}
.file .acts{display:flex;gap:6px;flex-wrap:wrap}
.file .acts button,.file .acts label{background:transparent;border:1px solid var(--line);border-radius:7px;padding:3px 10px;font-size:12px;cursor:pointer}
.file input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
@media (max-width:560px){
  .deck{grid-template-columns:1fr}
  .btns{flex-direction:row}
  .go{min-height:60px;font-size:22px}
  .cue{grid-template-columns:52px 1fr auto}
  .cue .ln{display:none}
  .tools .keys{display:none}
}
</style>

<div class="wrap">
  <header class="top">
    <h1 class="title">러브레터 대신 써드립니다</h1>
    <span class="sub">2026-2 정기공연 음향 큐 · 음향팀 1차 음원</span>
  </header>

  <div class="console">
    <div class="deck">
      <div class="standby" aria-live="polite">
        <div class="lbl">Standby · 다음 큐</div>
        <div class="row1"><span class="q" id="sbQ">0</span><span class="what" id="sbLine"></span></div>
        <div class="when" id="sbWhen"></div>
        <div class="what" id="sbWhat"></div>
      </div>
      <div class="btns">
        <button class="go" id="go" type="button">GO</button>
        <button class="stopall" id="stopall" type="button">전체 정지</button>
      </div>
    </div>
    <div class="live" id="live"></div>
    <div class="tools">
      <label for="vol">볼륨</label><input id="vol" type="range" min="0" max="100" value="80">
      <span class="load" id="load"></span>
      <span class="keys"><kbd>Space</kbd> GO · <kbd>Esc</kbd> 전체 정지 · <kbd>↑</kbd><kbd>↓</kbd> 큐 이동</span>
    </div>
    <nav class="scenes" id="scenes" aria-label="장 이동"></nav>
  </div>

  <main id="list"></main>

  <section class="bank" id="bank">
    <h2>음원 파일</h2>
    <p>음향팀 드라이브 「26-2 정기공연 음향 음원」 폴더의 1차 편집본 24개와 초인종 1개(Mixkit). 파일을 새로 올리면 그 소리를 쓰는 큐가 전부 바뀜. 올린 파일은 이 브라우저에만 저장됨.</p>
    <div class="files" id="files"></div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

/* ---------- storage ---------- */
var DB = null;
function openDB(){
  return new Promise(function(res){
    try{
      var r = indexedDB.open("loveletter-cues-v2",1);
      r.onupgradeneeded = function(){ r.result.createObjectStore("files"); };
      r.onsuccess = function(){ DB=r.result; res(DB); };
      r.onerror = function(){ res(null); };
    }catch(e){ res(null); }
  });
}
function dbOp(mode, fn){
  return new Promise(function(res){
    if(!DB) return res(null);
    try{
      var tx = DB.transaction("files", mode), st = tx.objectStore("files"), rq = fn(st);
      rq.onsuccess = function(){ res(rq.result); }; rq.onerror = function(){ res(null); };
    }catch(e){ res(null); }
  });
}

    Object.keys(bundleAB).forEach(decodeBundle);
  }
  if(ctx.state==="suspended") ctx.resume();
}
function decodeBlob(f, blob){
  return blob.arrayBuffer().then(function(ab){
    return new Promise(function(res,rej){ ctx.decodeAudioData(ab, res, rej); });
  }).then(function(buf){ userBuf[f]=buf; delete pendingBlobs[f]; }).catch(function(){ toast(FILES[f]+" 파일을 읽지 못함. mp3, m4a, wav로 다시 올려줘."); });
}
function decodeBundle(k){
  var ab = bundleAB[k]; if(!ab || !ctx) return; delete bundleAB[k];
  ctx.decodeAudioData(ab, function(b){ bundleBuf[k]=b; loaded++; showLoad(); buildFiles(); (waiters[k]||[]).forEach(function(fn){ fn(); }); delete waiters[k]; }, function(){ toast(FILES[k]+" 디코딩 실패"); });
}
function loadBundles(){
  Object.keys(BUNDLED).forEach(function(k){
    fetch(BUNDLED[k]).then(function(r){ if(!r.ok) throw 0; return r.arrayBuffer(); })
      .then(function(ab){ bundleAB[k]=ab; if(ctx) decodeBundle(k); else { loaded++; showLoad(); } }).catch(function(){ toast(FILES[k]+" 불러오기 실패"); });
  });
}
function showLoad(){
  var n = Object.keys(BUNDLED).length;
  $("load").textContent = ctx ? ("음원 "+Object.keys(bundleBuf).length+"/"+n+" 준비") : ("음원 "+loaded+"/"+n+" 받음 · GO 누르면 준비 완료");
}
function bufferHandle(buf, dest, loop){
  var src = ctx.createBufferSource(), g = ctx.createGain(), fin, done = new Promise(function(r){ fin=r; });
  src.buffer = buf; src.loop = loop; src.connect(g); g.connect(dest);
  src.onended = function(){ fin(); };
  src.start();
  var stopped=false;
  return { done:done, stop:function(fs){ if(stopped) return; stopped=true; fs = fs==null?.3:fs;
    var t=ctx.currentTime; g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value,t); g.gain.linearRampToValueAtTime(0,t+Math.max(fs,.01));
    setTimeout(function(){ try{src.stop();}catch(e){} fin(); }, (fs+.05)*1000); } };
}
function silentHandle(){ return {done:Promise.resolve(), stop:function(){}}; }
function startSound(f, dest){
  var loop = LOOPS.indexOf(f)>=0;
  if(userBuf[f]) return bufferHandle(userBuf[f], dest, loop);
  if(bundleBuf[f]) return bufferHandle(bundleBuf[f], dest, loop);
  if(!BUNDLED[f]){ toast((FILES[f]||f)+" 음원 없음"); return silentHandle(); }
  // not decoded yet: start as soon as it is ready
  var inner=null, stopped=false, fin, done=new Promise(function(r){fin=r;});
  (waiters[f]=waiters[f]||[]).push(function(){ if(stopped) return; inner=bufferHandle(bundleBuf[f], dest, loop); inner.done.then(fin); });
  return {done:done, stop:function(fs){ stopped=true; if(inner) inner.stop(fs); else fin(); }};
}
function stopCue(id, fade){
  var a = active[id]; if(!a) return;
  delete active[id];
  try{ a.h.stop(fade==null?.3:fade); }catch(e){}
  setTimeout(function(){ try{ a.g.disconnect(); }catch(e){} }, ((fade||.3)+.6)*1000);
}
function stopAll(){
  Object.keys(active).forEach(function(id){ stopCue(id,.8); });
  render();
}
function runCue(c){
  ensureCtx(); keepAwake();
  (c.stops||[]).forEach(function(id){ stopCue(id,1.5); });
  if(c.kind==="stop"){ (c.targets||[]).forEach(function(id){ stopCue(id,c.fade); }); render(); return; }
  if(c.kind!=="play") return;
  stopCue(c.id,.05);
  var g = ctx.createGain(), target = c.gain==null?1:c.gain, t = ctx.currentTime;
  g.connect(master);
  if(c.fadeIn){ g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(target,t+c.fadeIn); } else g.gain.value = target;
  var h = startSound(c.f, g);
  active[c.id] = {h:h, g:g};
  if(c.autoStop){ setTimeout(function(){ if(active[c.id] && active[c.id].h===h){ stopCue(c.id, c.autoFade||2); render(); } }, c.autoStop*1000); }
  Promise.resolve(h.done).then(function(){
    if(active[c.id] && active[c.id].h===h){ delete active[c.id]; try{g.disconnect();}catch(e){} render(); }
  });
  render();
}

/* ---------- cue pointer ---------- */
var ptr = Math.min(+lsGet("ll2-ptr",0)||0, playable.length-1);
function setPtr(p){ ptr = Math.max(0, Math.min(playable.length-1, p)); lsSet("ll2-ptr", ptr); render(true); }
function go(){
  var c = playable[ptr]; if(!c) return;
  runCue(c);
  if(ptr < playable.length-1) setPtr(ptr+1); else render();
}

/* ---------- wake lock ---------- */
var lock=null;
function keepAwake(){
  if(lock || !navigator.wakeLock) return;
  navigator.wakeLock.request("screen").then(function(l){ lock=l; l.addEventListener("release",function(){ lock=null; }); }).catch(function(){});
}
document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="visible" && ctx) keepAwake(); });

/* ---------- render ---------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m];}); }
function soundText(c){
  if(c.kind!=="play") return esc(c.what);
  var mine = userBuf[c.f]||pendingBlobs[c.f];
  return "<b>"+esc(FILES[c.f])+"</b>"+(c.label?" · "+esc(c.label):"")+
    (mine?"<span class=\"tag mine\">내 파일</span>":"")+
    (LOOPS.indexOf(c.f)>=0?"<span class=\"tag\">반복</span>":"");
}
function qLabel(c){
  if(c.kind==="stop") return "OUT"; if(c.kind==="note") return "없음";
  return c.id;
}
function sceneName(s){ for(var i=0;i<SCENES.length;i++) if(SCENES[i][0]===s) return SCENES[i][1]; return ""; }
function buildList(){
  var html="";
  SCENES.forEach(function(sc){
    html += "<section class=\"scene\" id=\"sc-"+sc[0]+"\"><h2>"+sc[1]+"</h2><div class=\"place\">"+sc[2]+"</div>";
    CUES.filter(function(c){return c.s===sc[0];}).forEach(function(c){
      html += "<div class=\"cue kind-"+c.kind+"\" data-id=\""+c.id+"\">"+
        "<span class=\"qn\">"+qLabel(c)+"</span><span class=\"ln\">"+(c.ln||"")+"</span>"+
        "<div class=\"body\"><div class=\"when\">"+esc(c.when)+"</div><div class=\"what\">"+soundText(c)+"</div></div>"+
        (c.kind==="note"?"<span></span>":"<button class=\"play\" type=\"button\" data-play=\""+c.id+"\" aria-label=\""+c.id+" 재생\">▶</button>")+
        "</div>";
    });
    html += "</section>";
  });
  $("list").innerHTML = html;
  $("scenes").innerHTML = SCENES.map(function(sc){ return "<button type=\"button\" data-sc=\""+sc[0]+"\">"+sc[1]+"</button>"; }).join("");
}
function buildFiles(){
  $("files").innerHTML = Object.keys(FILES).map(function(f){
    var mine = userName[f];
    return "<div class=\"file\"><div class=\"nm\">"+esc(FILES[f])+"</div>"+
      "<div class=\"src"+(mine?" mine":"")+"\">"+(mine?esc(mine):(bundleBuf[f]?"음향팀 음원 · 준비됨":"음향팀 음원"))+"</div>"+
      "<div class=\"acts\"><button type=\"button\" data-prev=\""+f+"\">미리 듣기</button>"+
      "<label>파일 바꾸기<input type=\"file\" id=\"up-"+f+"\" accept=\"audio/*\" data-up=\""+f+"\"></label>"+
      (mine?"<button type=\"button\" data-reset=\""+f+"\">원래대로</button>":"")+"</div></div>";
  }).join("");
}
function render(scroll){
  var c = playable[ptr];
  $("sbQ").textContent = c ? (c.kind==="stop" ? "OUT · "+c.targets.join(", ") : c.id) : "끝";
  $("sbLine").textContent = c ? (c.ln?"줄 "+c.ln+" · ":"")+sceneName(c.s) : "";
  $("sbWhen").textContent = c ? c.when : "";
  $("sbWhat").innerHTML = c ? soundText(c) : "";
  document.querySelectorAll(".cue").forEach(function(el){
    var id = el.getAttribute("data-id");
    el.classList.toggle("next", !!c && c.id===id);
    el.classList.toggle("playing", !!active[id]);
    var b = el.querySelector(".play"); if(b) b.textContent = active[id] ? "■" : "▶";
  });
  var ids = Object.keys(active);
  $("live").innerHTML = ids.length ? ids.map(function(id){
    var cc = byId[id];
    return "<span class=\"chip\"><span class=\"dot\"></span>"+id+" "+esc(FILES[cc.f])+"<button type=\"button\" data-stop=\""+id+"\" aria-label=\""+id+" 정지\">정지</button></span>";
  }).join("") : "<span class=\"none\">재생 중인 소리 없음</span>";
  if(scroll && c){
    var el = document.querySelector(".cue[data-id=\""+c.id+"\"]");
    if(el){
      var r = el.getBoundingClientRect(), top = document.querySelector(".console").getBoundingClientRect().bottom;
      if(r.top < top+8 || r.bottom > window.innerHeight-8) window.scrollBy({top: r.top - top - 80, behavior: "smooth"});
    }
  }
}

/* ---------- events ---------- */
var previewing = {};
document.addEventListener("click", function(e){
  var t = e.target.closest("[data-play],[data-stop],[data-sc],[data-prev],[data-reset],.cue");
  if(!t) return;
  if(t.hasAttribute("data-play")){
    var id=t.getAttribute("data-play"), c=byId[id];
    if(active[id]) { stopCue(id,.3); render(); return; }
    runCue(c); var pi = playable.indexOf(c); if(pi>=0 && pi<playable.length-1) setPtr(pi+1);
    return;
  }
  if(t.hasAttribute("data-stop")){ stopCue(t.getAttribute("data-stop"),.6); render(); return; }
  if(t.hasAttribute("data-sc")){
    var sec = $("sc-"+t.getAttribute("data-sc")); var top = document.querySelector(".console").getBoundingClientRect().bottom;
    window.scrollBy({top: sec.getBoundingClientRect().top - top - 8, behavior:"smooth"});
    var first = playable.filter(function(c){ return c.s===t.getAttribute("data-sc"); })[0];
    if(first) setPtr(playable.indexOf(first));
    return;
  }
  if(t.hasAttribute("data-prev")){
    var f=t.getAttribute("data-prev"); ensureCtx();
    if(previewing[f]){ try{previewing[f].stop(.2);}catch(err){} delete previewing[f]; t.textContent="미리 듣기"; return; }
    var h = startSound(f, master);
    previewing[f]=h; t.textContent="정지";
    Promise.resolve(h.done).then(function(){ if(previewing[f]===h){ delete previewing[f]; t.textContent="미리 듣기"; } });
    return;
  }
  if(t.hasAttribute("data-reset")){
    var rf=t.getAttribute("data-reset"); delete userBuf[rf]; delete userName[rf]; delete pendingBlobs[rf];
    dbOp("readwrite", function(st){ return st.delete(rf); });
    buildFiles(); buildList(); render(); toast(FILES[rf]+" 원래 음원으로 되돌림"); return;
  }
  if(t.classList.contains("cue") && !t.classList.contains("kind-note")){
    var pc = byId[t.getAttribute("data-id")]; setPtr(playable.indexOf(pc));
  }
});
document.addEventListener("change", function(e){
  var inp = e.target; if(!inp.hasAttribute || !inp.hasAttribute("data-up")) return;
  var f = inp.getAttribute("data-up"), file = inp.files && inp.files[0]; if(!file) return;
  userName[f] = file.name; pendingBlobs[f] = file;
  dbOp("readwrite", function(st){ return st.put({name:file.name, blob:file}, f); });
  ensureCtx();
  decodeBlob(f, file).then(function(){ buildFiles(); buildList(); render(); if(userBuf[f]) toast(FILES[f]+" ← "+file.name+" 적용"); });
});
document.addEventListener("keydown", function(e){
  if(e.target.closest && e.target.closest("input")) return;
  if(e.code==="Space"){ e.preventDefault(); go(); }
  else if(e.key==="Escape"){ e.preventDefault(); stopAll(); }
  else if(e.key==="ArrowDown"){ e.preventDefault(); setPtr(ptr+1); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); setPtr(ptr-1); }
});
$("go").addEventListener("click", function(e){ e.stopPropagation(); go(); this.blur(); });
$("stopall").addEventListener("click", function(e){ e.stopPropagation(); stopAll(); this.blur(); });
$("vol").value = vol;
$("vol").addEventListener("input", function(){ vol=+this.value; lsSet("ll-vol",vol); if(master) master.gain.setTargetAtTime(vol/100, ctx.currentTime, .05); });

var tt=null;
function toast(msg){ var el=$("toast"); el.textContent=msg; el.hidden=false; clearTimeout(tt); tt=setTimeout(function(){ el.hidden=true; },2600); }

/* ---------- boot ---------- */
buildList(); buildFiles(); render(); showLoad(); loadBundles();
window.__cp = {active:active, bundleBuf:bundleBuf, playable:playable, getPtr:function(){return ptr;}, ctx:function(){return ctx;}};
openDB().then(function(){
  return dbOp("readonly", function(st){ return st.getAllKeys(); }).then(function(keys){
    return Promise.all((keys||[]).map(function(k){
      return dbOp("readonly", function(st){ return st.get(k); }).then(function(v){ if(v&&v.blob){ userName[k]=v.name; pendingBlobs[k]=v.blob; } });
    }));
  });
}).then(function(){ buildFiles(); buildList(); render(); });
})();
</script>

</body></html>
